<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Морской бой чата — общая сцена для OBS</title>
<style>
  /* Сцена полностью прозрачная: в OBS это один источник «Браузер», а
     «Светлячки» и «Морской бой» лежат друг на друге и переключаются. */
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
  }
  /* Слои: оба на весь кадр, прозрачные, плавно гаснут за 1,5 с. */
  .layer {
    position: fixed;
    inset: 0;
    border: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    transition: opacity 1.5s ease;
  }
  .is-hidden {
    opacity: 0;
    visibility: hidden;
  }
</style>
</head>
<body>
<!-- «Светлячки» — уже опубликованная страница; параметры её ссылки
     передаются как есть (или через параметр svet_url). -->
<iframe id="svet" class="layer"
        src="https://andreyshapira1983-sketch.github.io/svetlyachki/index.html"
        title="Светлячки"></iframe>
<!-- «Морской бой» — своя страница рядом. Пока его не видно, он получает
     postMessage «visible:false» и не рисует кадры, но мир живёт. -->
<iframe id="battle" class="layer is-hidden" src="index.html"
        title="Морской бой"></iframe>
<!-- Обычные скрипты по порядку: страница работает и с GitHub Pages,
     и открытая как локальный файл в OBS. Модулей здесь нет. -->
<script src="js/config.js"></script>
<script src="js/chat.js"></script>
<script src="js/commands.js"></script>
<script src="js/stage.js"></script>
</body>
</html>
