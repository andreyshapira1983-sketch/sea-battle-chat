<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Морской бой чата — картинка для OBS</title>
<style>
  /* Оверлей для OBS: прозрачный фон, холст на весь источник, без полос. */
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f4f7ff;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Подсказка видна только когда нечего показывать: ни канала, ни демо.
     В OBS со зрителями её не будет — main.js её прячет после входа. */
  #hint {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 780px;
    padding: 24px 32px;
    box-sizing: border-box;
    border: 1px solid rgba(140, 210, 255, 0.34);
    border-radius: 18px;
    background: rgba(6, 20, 38, 0.72);
    text-align: center;
    font-size: 26px;
    line-height: 1.35;
    letter-spacing: 0.2px;
    pointer-events: none;
  }
  #hint strong {
    display: block;
    margin-bottom: 10px;
    font-size: 31px;
    font-weight: 600;
  }
  #hint span {
    opacity: 0.86;
    font-size: 22px;
  }
  #hint[aria-hidden="true"] {
    display: none;
  }
</style>
</head>
<body>
<canvas id="sea" width="1920" height="1080"></canvas>
<div id="hint" aria-hidden="false">
  <strong>Укажите канал Twitch</strong>
  <span>Откройте builder.html, впишите имя канала — ссылка для источника «Браузер» в OBS появится сама.
  Хотите посмотреть игру без чата? Добавьте к ссылке demo=1.</span>
</div>
<!-- Обычные скрипты по порядку: страница работает и с GitHub Pages,
     и открытая как локальный файл в OBS. Модулей здесь нет. -->
<script src="js/config.js"></script>
<script src="js/chat.js"></script>
<script src="js/commands.js"></script>
<script src="js/mask.js"></script>
<script src="js/colors.js"></script>
<script src="js/layout.js"></script>
<script src="js/game.js"></script>
<script src="js/demo.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
